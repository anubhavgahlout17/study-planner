<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Planner</title>
  <style>
    /* ── Reset & Variables ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #22263a;
      --border:    #2e3250;
      --text:      #e8eaf6;
      --muted:     #7c84b0;
      --accent:    #6c63ff;
      --accent2:   #48cae4;
      --green:     #43d97b;
      --yellow:    #f9c74f;
      --red:       #f25c54;
      --radius:    10px;
      --shadow:    0 4px 24px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Scrollbar ───────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Top Nav ─────────────────────────────────────────────── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      height: 58px;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    nav .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
      margin-right: auto;
    }
    nav .logo span { color: var(--text); }
    .nav-tabs { display: flex; gap: 4px; }
    .nav-tab {
      padding: 7px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      color: var(--muted);
      transition: all .2s;
      border: none;
      background: none;
      font-family: inherit;
    }
    .nav-tab:hover { color: var(--text); background: var(--surface2); }
    .nav-tab.active { color: var(--accent); background: rgba(108,99,255,.15); font-weight: 600; }

    /* ── Layout ──────────────────────────────────────────────── */
    .app { display: flex; flex: 1; overflow: hidden; }

    aside {
      width: 230px;
      min-width: 230px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }
    .sidebar-title {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      padding: 8px 8px 4px;
    }
    .sidebar-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: .875rem;
      color: var(--muted);
      background: none;
      border: none;
      font-family: inherit;
      width: 100%;
      text-align: left;
      transition: all .2s;
    }
    .sidebar-btn:hover  { color: var(--text); background: var(--surface2); }
    .sidebar-btn.active { color: var(--accent); background: rgba(108,99,255,.15); font-weight: 600; }
    .sidebar-btn .icon  { font-size: 1rem; width: 20px; text-align: center; }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
    }

    /* ── Page sections ───────────────────────────────────────── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── Section header ──────────────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .section-header h2 { font-size: 1.35rem; font-weight: 700; }
    .section-header .sub { color: var(--muted); font-size: .85rem; margin-top: 2px; }

    /* ── Stat cards ──────────────────────────────────────────── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .stat-card .stat-label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
    .stat-card .stat-value { font-size: 2rem; font-weight: 700; margin-top: 4px; }
    .stat-card.green .stat-value { color: var(--green); }
    .stat-card.yellow .stat-value { color: var(--yellow); }
    .stat-card.red    .stat-value { color: var(--red); }
    .stat-card.accent .stat-value { color: var(--accent); }
    .stat-card.blue   .stat-value { color: var(--accent2); }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: .875rem;
      font-weight: 500;
      transition: all .2s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #5a52e0; }
    .btn-ghost   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger  { background: rgba(242,92,84,.15); color: var(--red); border: 1px solid rgba(242,92,84,.3); }
    .btn-danger:hover { background: rgba(242,92,84,.25); }
    .btn-success { background: rgba(67,217,123,.15); color: var(--green); border: 1px solid rgba(67,217,123,.3); }
    .btn-success:hover { background: rgba(67,217,123,.25); }
    .btn-sm { padding: 5px 10px; font-size: .8rem; }

    /* ── Cards / lists ───────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      padding: 16px 20px;
      transition: border-color .2s;
    }
    .card:hover { border-color: var(--accent); }

    /* ── Task card ───────────────────────────────────────────── */
    .task-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .task-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      cursor: pointer;
      margin-top: 2px;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .task-check:hover { border-color: var(--green); }
    .task-check.done  { background: var(--green); border-color: var(--green); }
    .task-check.done::after { content: '✓'; color: #000; font-size: .7rem; font-weight: 800; }
    .task-body { flex: 1; min-width: 0; }
    .task-title {
      font-weight: 600;
      font-size: .95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-title.done { text-decoration: line-through; color: var(--muted); }
    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .task-notes { font-size: .8rem; color: var(--muted); margin-top: 4px; }
    .task-actions { display: flex; gap: 6px; flex-shrink: 0; }

    /* ── Badges ──────────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 600;
    }
    .badge-high    { background: rgba(242,92,84,.18);  color: var(--red); }
    .badge-medium  { background: rgba(249,199,79,.18); color: var(--yellow); }
    .badge-low     { background: rgba(67,217,123,.18); color: var(--green); }
    .badge-pending    { background: rgba(124,132,176,.18); color: var(--muted); }
    .badge-inprog     { background: rgba(72,202,228,.18);  color: var(--accent2); }
    .badge-completed  { background: rgba(67,217,123,.18);  color: var(--green); }
    .badge-overdue    { background: rgba(242,92,84,.18);    color: var(--red); }
    .badge-subj    { background: rgba(108,99,255,.18); color: var(--accent); }
    .badge-date    { background: var(--surface2); color: var(--muted); }

    /* ── Forms ───────────────────────────────────────────────── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .form-grid.full { grid-template-columns: 1fr; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.span2 { grid-column: span 2; }
    label { font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
    input, select, textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: .9rem;
      padding: 9px 12px;
      transition: border-color .2s;
      outline: none;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select option { background: var(--surface2); }
    textarea { resize: vertical; min-height: 72px; }

    .form-row {
      display: flex;
      gap: 14px;
      margin-bottom: 14px;
    }
    .form-row .form-group { flex: 1; }

    /* ── Modal ───────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 520px;
      box-shadow: var(--shadow);
      transform: translateY(16px);
      transition: transform .25s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .modal-header h3 { font-size: 1.1rem; font-weight: 700; }
    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }
    .modal-close:hover { color: var(--text); }
    .modal-footer { margin-top: 22px; display: flex; justify-content: flex-end; gap: 10px; }

    /* ── Filter bar ──────────────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      align-items: center;
    }
    .filter-chip {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: .8rem;
      cursor: pointer;
      transition: all .2s;
      font-family: inherit;
    }
    .filter-chip:hover  { border-color: var(--accent); color: var(--text); }
    .filter-chip.active { border-color: var(--accent); background: rgba(108,99,255,.15); color: var(--accent); font-weight: 600; }
    .filter-bar select { max-width: 180px; padding: 5px 10px; font-size: .8rem; }

    /* ── Progress bar ────────────────────────────────────────── */
    .progress-bar-bg {
      background: var(--surface2);
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width .5s ease;
    }

    /* ── Progress cards ──────────────────────────────────────── */
    .progress-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      margin-bottom: 12px;
    }
    .progress-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .progress-card-name { font-size: 1rem; font-weight: 700; }
    .progress-card-pct { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    .progress-card-stats { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
    .progress-stat { font-size: .8rem; color: var(--muted); }
    .progress-stat strong { color: var(--text); }

    /* ── Subject list ────────────────────────────────────────── */
    .subject-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
    }
    .subject-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .subject-name { flex: 1; font-weight: 600; }
    .subject-count { font-size: .8rem; color: var(--muted); }

    /* ── Session card ────────────────────────────────────────── */
    .session-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
    }
    .session-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(108,99,255,.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .session-body { flex: 1; }
    .session-title { font-weight: 600; font-size: .95rem; }
    .session-meta  { font-size: .8rem; color: var(--muted); margin-top: 3px; }

    /* ── Empty state ─────────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }
    .empty .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty p { font-size: .9rem; }

    /* ── Toast ───────────────────────────────────────────────── */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 999;
    }
    .toast {
      padding: 12px 18px;
      border-radius: 10px;
      font-size: .875rem;
      font-weight: 500;
      box-shadow: var(--shadow);
      animation: slideIn .3s ease;
      max-width: 320px;
    }
    .toast.success { background: #1a3a28; color: var(--green); border: 1px solid rgba(67,217,123,.3); }
    .toast.error   { background: #3a1a1a; color: var(--red);   border: 1px solid rgba(242,92,84,.3); }
    @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 768px) {
      aside { display: none; }
      main  { padding: 18px 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.span2 { grid-column: span 1; }
      nav { padding: 0 14px; }
    }
  </style>
</head>
<body>

<!-- ── Navigation ──────────────────────────────────────────────── -->
<nav>
  <div class="logo">Study<span>Planner</span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchPage('dashboard')">Dashboard</button>
    <button class="nav-tab" onclick="switchPage('tasks')">Tasks</button>
    <button class="nav-tab" onclick="switchPage('sessions')">Sessions</button>
    <button class="nav-tab" onclick="switchPage('progress')">Progress</button>
    <button class="nav-tab" onclick="switchPage('subjects')">Subjects</button>
  </div>
</nav>

<div class="app">

<!-- ── Sidebar ─────────────────────────────────────────────────── -->
<aside>
  <div class="sidebar-title">Menu</div>
  <button class="sidebar-btn active" onclick="switchPage('dashboard')"><span class="icon">🏠</span>Dashboard</button>
  <button class="sidebar-btn" onclick="switchPage('tasks')"><span class="icon">✅</span>Tasks</button>
  <button class="sidebar-btn" onclick="switchPage('sessions')"><span class="icon">⏱</span>Sessions</button>
  <button class="sidebar-btn" onclick="switchPage('progress')"><span class="icon">📊</span>Progress</button>
  <button class="sidebar-btn" onclick="switchPage('subjects')"><span class="icon">📚</span>Subjects</button>

  <div class="sidebar-title" style="margin-top:14px">Quick Add</div>
  <button class="sidebar-btn" onclick="openTaskModal()"><span class="icon">+</span>New Task</button>
  <button class="sidebar-btn" onclick="openSessionModal()"><span class="icon">+</span>Log Session</button>
  <button class="sidebar-btn" onclick="openSubjectModal()"><span class="icon">+</span>Add Subject</button>
</aside>

<!-- ── Main ────────────────────────────────────────────────────── -->
<main>

  <!-- Dashboard -->
  <div id="page-dashboard" class="page active">
    <div class="section-header">
      <div><h2>Dashboard</h2><div class="sub" id="dash-date"></div></div>
      <button class="btn btn-primary" onclick="openTaskModal()">+ Add Task</button>
    </div>
    <div class="stat-grid" id="dash-stats"></div>
    <div class="section-header" style="margin-top:8px">
      <h2 style="font-size:1.1rem">Due Today</h2>
    </div>
    <div id="dash-today"></div>
    <div class="section-header" style="margin-top:20px">
      <h2 style="font-size:1.1rem">Overdue</h2>
    </div>
    <div id="dash-overdue"></div>
  </div>

  <!-- Tasks -->
  <div id="page-tasks" class="page">
    <div class="section-header">
      <div><h2>Tasks</h2><div class="sub">Manage your study tasks</div></div>
      <button class="btn btn-primary" onclick="openTaskModal()">+ Add Task</button>
    </div>
    <div class="filter-bar">
      <button class="filter-chip active" onclick="setTaskFilter('all',this)">All</button>
      <button class="filter-chip" onclick="setTaskFilter('today',this)">Today</button>
      <button class="filter-chip" onclick="setTaskFilter('week',this)">This Week</button>
      <button class="filter-chip" onclick="setTaskFilter('overdue',this)">Overdue</button>
      <button class="filter-chip" onclick="setTaskFilter('pending',this)">Pending</button>
      <button class="filter-chip" onclick="setTaskFilter('inprog',this)">In Progress</button>
      <button class="filter-chip" onclick="setTaskFilter('completed',this)">Completed</button>
      <select id="filter-subject" onchange="renderTasks()">
        <option value="">All Subjects</option>
      </select>
    </div>
    <div id="task-list"></div>
  </div>

  <!-- Sessions -->
  <div id="page-sessions" class="page">
    <div class="section-header">
      <div><h2>Study Sessions</h2><div class="sub">Track your study time</div></div>
      <button class="btn btn-primary" onclick="openSessionModal()">+ Log Session</button>
    </div>
    <div id="session-list"></div>
  </div>

  <!-- Progress -->
  <div id="page-progress" class="page">
    <div class="section-header">
      <div><h2>Progress Overview</h2><div class="sub">Per-subject breakdown</div></div>
    </div>
    <div id="progress-list"></div>
  </div>

  <!-- Subjects -->
  <div id="page-subjects" class="page">
    <div class="section-header">
      <div><h2>Subjects</h2><div class="sub">Manage your subjects</div></div>
      <button class="btn btn-primary" onclick="openSubjectModal()">+ Add Subject</button>
    </div>
    <div id="subject-list"></div>
  </div>

</main>
</div>

<!-- ── Modals ────────────────────────────────────────────────────── -->

<!-- Add Task Modal -->
<div class="modal-overlay" id="modal-task">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-task-title">Add Task</h3>
      <button class="modal-close" onclick="closeModal('modal-task')">×</button>
    </div>
    <input type="hidden" id="task-edit-id" />
    <div class="form-grid">
      <div class="form-group span2">
        <label>Title</label>
        <input type="text" id="task-title" placeholder="e.g. Read chapter 5" />
      </div>
      <div class="form-group">
        <label>Subject</label>
        <select id="task-subject"></select>
      </div>
      <div class="form-group">
        <label>Due Date</label>
        <input type="date" id="task-due" />
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="task-priority">
          <option value="High">High</option>
          <option value="Medium" selected>Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="task-status">
          <option value="Pending" selected>Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="form-group span2">
        <label>Notes</label>
        <textarea id="task-notes" placeholder="Optional notes..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-task')">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<!-- Add Session Modal -->
<div class="modal-overlay" id="modal-session">
  <div class="modal">
    <div class="modal-header">
      <h3>Log Study Session</h3>
      <button class="modal-close" onclick="closeModal('modal-session')">×</button>
    </div>
    <div class="form-grid">
      <div class="form-group span2">
        <label>Subject</label>
        <select id="session-subject"></select>
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="session-date" />
      </div>
      <div class="form-group">
        <label>Duration (minutes)</label>
        <input type="number" id="session-duration" min="1" placeholder="60" />
      </div>
      <div class="form-group span2">
        <label>Notes</label>
        <textarea id="session-notes" placeholder="What did you study?"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-session')">Cancel</button>
      <button class="btn btn-primary" onclick="saveSession()">Log Session</button>
    </div>
  </div>
</div>

<!-- Add Subject Modal -->
<div class="modal-overlay" id="modal-subject">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <h3>Add Subject</h3>
      <button class="modal-close" onclick="closeModal('modal-subject')">×</button>
    </div>
    <div class="form-group">
      <label>Subject Name</label>
      <input type="text" id="subject-name" placeholder="e.g. Mathematics" />
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-subject')">Cancel</button>
      <button class="btn btn-primary" onclick="saveSubject()">Add Subject</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<!-- ── JavaScript ─────────────────────────────────────────────── -->
<script>
/* ── State ──────────────────────────────────────────────────── */
let subjects = [];
let tasks    = [];
let sessions = [];
let taskFilter = 'all';
let currentPage = 'dashboard';

/* ── Init ───────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('dash-date').textContent =
    new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  // Set today as default date in forms
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('task-due').value   = today;
  document.getElementById('session-date').value = today;
  loadAll();
});

/* ── Data loading ───────────────────────────────────────────── */
async function loadAll() {
  await Promise.all([loadSubjects(), loadTasks(), loadSessions()]);
  renderCurrentPage();
}

async function loadSubjects() {
  const res = await fetch('/api/subjects');
  subjects = await res.json();
  populateSubjectSelects();
}

async function loadTasks() {
  const res = await fetch('/api/tasks');
  tasks = await res.json();
}

async function loadSessions() {
  const res = await fetch('/api/sessions');
  sessions = await res.json();
}

/* ── Page routing ───────────────────────────────────────────── */
function switchPage(name) {
  currentPage = name;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach((t,i) => {
    const pages = ['dashboard','tasks','sessions','progress','subjects'];
    t.classList.toggle('active', pages[i] === name);
  });
  document.querySelectorAll('.sidebar-btn:not([onclick*="Modal"])').forEach(b => {
    b.classList.toggle('active', b.getAttribute('onclick')?.includes(name));
  });
  renderCurrentPage();
}

function renderCurrentPage() {
  if (currentPage === 'dashboard') renderDashboard();
  else if (currentPage === 'tasks')    renderTasks();
  else if (currentPage === 'sessions') renderSessions();
  else if (currentPage === 'progress') renderProgress();
  else if (currentPage === 'subjects') renderSubjects();
}

/* ── Subject selects ────────────────────────────────────────── */
function populateSubjectSelects() {
  ['task-subject','session-subject','filter-subject'].forEach(id => {
    const sel = document.getElementById(id);
    const prev = sel.value;
    const hasAll = id === 'filter-subject';
    sel.innerHTML = hasAll ? '<option value="">All Subjects</option>' : '';
    subjects.forEach(s => {
      const o = document.createElement('option');
      o.value = s.name;
      o.textContent = s.name;
      sel.appendChild(o);
    });
    if (prev) sel.value = prev;
  });
}

/* ── Dashboard ──────────────────────────────────────────────── */
function renderDashboard() {
  const today = new Date().toISOString().split('T')[0];
  const total   = tasks.length;
  const done    = tasks.filter(t => t.status === 'Completed').length;
  const overdue = tasks.filter(t => t.overdue).length;
  const todayTasks = tasks.filter(t => t.due_date === today && t.status !== 'Completed');
  const totalMins  = sessions.reduce((a, s) => a + s.duration_minutes, 0);

  document.getElementById('dash-stats').innerHTML = `
    <div class="stat-card accent"><div class="stat-label">Total Tasks</div><div class="stat-value">${total}</div></div>
    <div class="stat-card green"><div class="stat-label">Completed</div><div class="stat-value">${done}</div></div>
    <div class="stat-card red"><div class="stat-label">Overdue</div><div class="stat-value">${overdue}</div></div>
    <div class="stat-card yellow"><div class="stat-label">Due Today</div><div class="stat-value">${todayTasks.length}</div></div>
    <div class="stat-card blue"><div class="stat-label">Study Time</div><div class="stat-value">${Math.floor(totalMins/60)}h ${totalMins%60}m</div></div>
    <div class="stat-card"><div class="stat-label">Subjects</div><div class="stat-value" style="color:var(--text)">${subjects.length}</div></div>
  `;

  document.getElementById('dash-today').innerHTML =
    todayTasks.length ? todayTasks.map(t => taskCardHTML(t)).join('') :
    '<div class="empty"><div class="empty-icon">🎉</div><p>No tasks due today!</p></div>';

  const overdueTasks = tasks.filter(t => t.overdue);
  document.getElementById('dash-overdue').innerHTML =
    overdueTasks.length ? overdueTasks.map(t => taskCardHTML(t)).join('') :
    '<div class="empty"><div class="empty-icon">✅</div><p>No overdue tasks!</p></div>';
}

/* ── Tasks ──────────────────────────────────────────────────── */
function setTaskFilter(filter, el) {
  taskFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

function renderTasks() {
  const today = new Date().toISOString().split('T')[0];
  const weekEnd = new Date(); weekEnd.setDate(weekEnd.getDate() + 6);
  const subjFilter = document.getElementById('filter-subject').value;

  let filtered = tasks.filter(t => !subjFilter || t.subject === subjFilter);

  if (taskFilter === 'today')     filtered = filtered.filter(t => t.due_date === today);
  else if (taskFilter === 'week') filtered = filtered.filter(t => t.due_date >= today && t.due_date <= weekEnd.toISOString().split('T')[0]);
  else if (taskFilter === 'overdue')   filtered = filtered.filter(t => t.overdue);
  else if (taskFilter === 'pending')   filtered = filtered.filter(t => t.status === 'Pending');
  else if (taskFilter === 'inprog')    filtered = filtered.filter(t => t.status === 'In Progress');
  else if (taskFilter === 'completed') filtered = filtered.filter(t => t.status === 'Completed');

  // Sort: overdue first, then by due date, then priority
  const pw = { High: 0, Medium: 1, Low: 2 };
  filtered.sort((a,b) => {
    if (a.overdue !== b.overdue) return a.overdue ? -1 : 1;
    if (a.due_date !== b.due_date) return a.due_date < b.due_date ? -1 : 1;
    return (pw[a.priority]||1) - (pw[b.priority]||1);
  });

  document.getElementById('task-list').innerHTML = filtered.length
    ? filtered.map(t => taskCardHTML(t)).join('')
    : '<div class="empty"><div class="empty-icon">📭</div><p>No tasks found.</p></div>';
}

function taskCardHTML(t) {
  const isDone = t.status === 'Completed';
  const fmt = d => { const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };
  return `
  <div class="card" id="tcard-${t.task_id}">
    <div class="task-card">
      <div class="task-check ${isDone ? 'done' : ''}" onclick="toggleComplete('${t.task_id}','${t.status}')"></div>
      <div class="task-body">
        <div class="task-title ${isDone ? 'done' : ''}">${esc(t.title)}</div>
        <div class="task-meta">
          <span class="badge badge-subj">${esc(t.subject)}</span>
          <span class="badge badge-${t.priority.toLowerCase()}">${t.priority}</span>
          <span class="badge badge-${statusKey(t.status)}">${t.status}</span>
          <span class="badge badge-date">📅 ${fmt(t.due_date)}</span>
          ${t.overdue ? '<span class="badge badge-overdue">OVERDUE</span>' : ''}
        </div>
        ${t.notes ? `<div class="task-notes">${esc(t.notes)}</div>` : ''}
      </div>
      <div class="task-actions">
        <button class="btn btn-ghost btn-sm" onclick="editTask('${t.task_id}')">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteTask('${t.task_id}')">Del</button>
      </div>
    </div>
  </div>`;
}

function statusKey(s) {
  return s === 'In Progress' ? 'inprog' : s === 'Completed' ? 'completed' : 'pending';
}

async function toggleComplete(id, currentStatus) {
  const newStatus = currentStatus === 'Completed' ? 'Pending' : 'Completed';
  await fetch(`/api/tasks/${id}`, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ status: newStatus })
  });
  await loadTasks();
  renderCurrentPage();
  toast(newStatus === 'Completed' ? 'Task completed!' : 'Task reopened', 'success');
}

async function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
  await loadTasks();
  renderCurrentPage();
  toast('Task deleted', 'success');
}

/* ── Task Modal ─────────────────────────────────────────────── */
function openTaskModal(task) {
  document.getElementById('task-edit-id').value  = task ? task.task_id : '';
  document.getElementById('modal-task-title').textContent = task ? 'Edit Task' : 'Add Task';
  document.getElementById('task-title').value    = task ? task.title    : '';
  document.getElementById('task-subject').value  = task ? task.subject  : (subjects[0]?.name || '');
  document.getElementById('task-due').value      = task ? task.due_date : new Date().toISOString().split('T')[0];
  document.getElementById('task-priority').value = task ? task.priority : 'Medium';
  document.getElementById('task-status').value   = task ? task.status   : 'Pending';
  document.getElementById('task-notes').value    = task ? task.notes    : '';
  openModal('modal-task');
}

function editTask(id) {
  const t = tasks.find(t => t.task_id === id);
  if (t) openTaskModal(t);
}

async function saveTask() {
  const id      = document.getElementById('task-edit-id').value;
  const title   = document.getElementById('task-title').value.trim();
  const subject = document.getElementById('task-subject').value;
  const due     = document.getElementById('task-due').value;
  const priority= document.getElementById('task-priority').value;
  const status  = document.getElementById('task-status').value;
  const notes   = document.getElementById('task-notes').value.trim();

  if (!title)   { toast('Title is required', 'error'); return; }
  if (!subject) { toast('Select a subject', 'error'); return; }
  if (!due)     { toast('Due date is required', 'error'); return; }

  const payload = { title, subject, due_date: due, priority, status, notes };
  if (id) {
    await fetch(`/api/tasks/${id}`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    toast('Task updated!', 'success');
  } else {
    await fetch('/api/tasks', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    toast('Task added!', 'success');
  }
  closeModal('modal-task');
  await loadTasks();
  renderCurrentPage();
}

/* ── Sessions ───────────────────────────────────────────────── */
function renderSessions() {
  const totalMins = sessions.reduce((a, s) => a + s.duration_minutes, 0);
  const bySubj = {};
  sessions.forEach(s => { bySubj[s.subject] = (bySubj[s.subject]||0) + s.duration_minutes; });

  let html = '';
  if (sessions.length) {
    html += `<div class="stat-grid" style="margin-bottom:20px">
      <div class="stat-card blue"><div class="stat-label">Total Time</div><div class="stat-value">${Math.floor(totalMins/60)}h ${totalMins%60}m</div></div>
      <div class="stat-card accent"><div class="stat-label">Sessions</div><div class="stat-value">${sessions.length}</div></div>
    </div>`;
    html += sessions.map(s => `
      <div class="card">
        <div class="session-card">
          <div class="session-icon">📖</div>
          <div class="session-body">
            <div class="session-title">${esc(s.subject)}</div>
            <div class="session-meta">${s.date} &nbsp;•&nbsp; ${s.duration_minutes} min${s.notes ? ' &nbsp;•&nbsp; ' + esc(s.notes) : ''}</div>
          </div>
          <button class="btn btn-danger btn-sm" onclick="deleteSession('${s.session_id}')">Del</button>
        </div>
      </div>`).join('');
  } else {
    html = '<div class="empty"><div class="empty-icon">⏱</div><p>No sessions logged yet. Start studying!</p></div>';
  }
  document.getElementById('session-list').innerHTML = html;
}

function openSessionModal() {
  document.getElementById('session-subject').value  = subjects[0]?.name || '';
  document.getElementById('session-date').value     = new Date().toISOString().split('T')[0];
  document.getElementById('session-duration').value = '60';
  document.getElementById('session-notes').value    = '';
  openModal('modal-session');
}

async function saveSession() {
  const subject  = document.getElementById('session-subject').value;
  const date     = document.getElementById('session-date').value;
  const duration = parseInt(document.getElementById('session-duration').value);
  const notes    = document.getElementById('session-notes').value.trim();

  if (!subject)        { toast('Select a subject', 'error'); return; }
  if (!date)           { toast('Date is required', 'error'); return; }
  if (!duration || duration <= 0) { toast('Enter a valid duration', 'error'); return; }

  const res = await fetch('/api/sessions', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ subject, date, duration_minutes: duration, notes })
  });
  if (res.ok) {
    closeModal('modal-session');
    await loadSessions();
    renderCurrentPage();
    toast(`Logged ${duration} min of ${subject}!`, 'success');
  } else {
    const err = await res.json();
    toast(err.error || 'Failed to log session', 'error');
  }
}

async function deleteSession(id) {
  if (!confirm('Delete this session?')) return;
  await fetch(`/api/sessions/${id}`, { method: 'DELETE' });
  await loadSessions();
  renderCurrentPage();
  toast('Session deleted', 'success');
}

/* ── Progress ───────────────────────────────────────────────── */
async function renderProgress() {
  const res  = await fetch('/api/progress');
  const data = await res.json();
  if (!data.length) {
    document.getElementById('progress-list').innerHTML =
      '<div class="empty"><div class="empty-icon">📊</div><p>Add subjects and tasks to see progress.</p></div>';
    return;
  }
  document.getElementById('progress-list').innerHTML = data.map(p => {
    const color = p.percent >= 75 ? 'var(--green)' : p.percent >= 40 ? 'var(--yellow)' : 'var(--red)';
    const hrs = Math.floor(p.minutes/60), mins = p.minutes % 60;
    return `
    <div class="progress-card">
      <div class="progress-card-header">
        <div class="progress-card-name">${esc(p.name)}</div>
        <div class="progress-card-pct" style="color:${color}">${p.percent}%</div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width:${p.percent}%;background:${color}"></div>
      </div>
      <div class="progress-card-stats">
        <div class="progress-stat">Total <strong>${p.total}</strong></div>
        <div class="progress-stat">Done <strong style="color:var(--green)">${p.done}</strong></div>
        <div class="progress-stat">In Progress <strong style="color:var(--accent2)">${p.inprog}</strong></div>
        <div class="progress-stat">Overdue <strong style="color:var(--red)">${p.overdue}</strong></div>
        <div class="progress-stat">Study Time <strong style="color:var(--accent2)">${hrs}h ${mins}m</strong></div>
      </div>
    </div>`;
  }).join('');
}

/* ── Subjects ───────────────────────────────────────────────── */
function renderSubjects() {
  if (!subjects.length) {
    document.getElementById('subject-list').innerHTML =
      '<div class="empty"><div class="empty-icon">📚</div><p>No subjects yet. Add one to get started!</p></div>';
    return;
  }
  document.getElementById('subject-list').innerHTML = subjects.map(s => {
    const count = tasks.filter(t => t.subject === s.name).length;
    const done  = tasks.filter(t => t.subject === s.name && t.status === 'Completed').length;
    return `
    <div class="subject-item">
      <div class="subject-dot"></div>
      <div class="subject-name">${esc(s.name)}</div>
      <div class="subject-count">${done}/${count} tasks</div>
      <button class="btn btn-danger btn-sm" onclick="deleteSubject('${s.subject_id}','${esc(s.name)}')">Remove</button>
    </div>`;
  }).join('');
}

function openSubjectModal() {
  document.getElementById('subject-name').value = '';
  openModal('modal-subject');
}

async function saveSubject() {
  const name = document.getElementById('subject-name').value.trim();
  if (!name) { toast('Subject name required', 'error'); return; }
  const res = await fetch('/api/subjects', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name })
  });
  if (res.ok) {
    closeModal('modal-subject');
    await loadSubjects();
    renderCurrentPage();
    toast(`Subject "${name}" added!`, 'success');
  } else {
    const err = await res.json();
    toast(err.error || 'Failed to add subject', 'error');
  }
}

async function deleteSubject(id, name) {
  if (!confirm(`Remove "${name}" and all its tasks?`)) return;
  await fetch(`/api/subjects/${id}`, { method: 'DELETE' });
  await loadAll();
  toast(`Subject "${name}" removed`, 'success');
}

/* ── Modal helpers ──────────────────────────────────────────── */
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// Close on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// Enter key in subject modal
document.getElementById('subject-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveSubject();
});

/* ── Toast ──────────────────────────────────────────────────── */
function toast(msg, type = 'success') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ── Utility ────────────────────────────────────────────────── */
function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
